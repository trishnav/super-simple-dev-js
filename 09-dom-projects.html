<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dom-project</title>
  </head>
  <body>
    <h5>Rock-Paper-Scissor</h5>

    <button onclick="playGame('Rock')">Rock</button>
    <button onclick="playGame('Paper')">Paper</button>
    <button onclick="playGame('Scissors')">Scissors</button>

    <p class="js-score">Wins: 0, Loses: 0, Ties: 0</p>

    <button
      onclick="
        scores.wins = 0;
        scores.losses = 0;
        scores.ties = 0;
        localStorage.setItem('score', JSON.stringify(scores));

        document.querySelector('.js-score').textContent =
          `Wins: 0, Loses: 0, Ties: 0`;
      "
    >
      Reset Score
    </button>

    <script>
      let scores = JSON.parse(localStorage.getItem("score"));

      if (!scores) {
        scores = {
          wins: 0,
          losses: 0,
          ties: 0,
        };
      }

      function compMove() {
        const randomNumber = Math.random();
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          return `Rock`;
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          return `Paper`;
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          return `Scissors`;
        }
      }

      function playGame(playerMove) {
        let computerMove = compMove();
        let results = ``;
        if (computerMove === playerMove) {
          results = `Tie`;
        } else if (
          (computerMove === "Rock" && playerMove === "Scissors") ||
          (computerMove === "Paper" && playerMove === "Rock") ||
          (computerMove === "Scissors" && playerMove === "Paper")
        ) {
          results = `You Lose`;
        } else {
          results = `You Win`;
        }

        if (results === `You Win`) {
          scores.wins += 1;
        } else if (results === `You Lose`) {
          scores.losses += 1;
        } else if (results === `Tie`) {
          scores.ties += 1;
        }

        localStorage.setItem("score", JSON.stringify(scores));
        document.querySelector(".js-score").textContent =
          `Wins: ${scores.wins}, Loses: ${scores.losses}, Ties: ${scores.ties}`;
        return results;
      }
    </script>
  </body>
</html>
