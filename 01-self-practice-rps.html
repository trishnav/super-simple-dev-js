<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissor</p>
    <button onclick="playGame(`rock`)">Rock</button>
    <button onclick="playGame(`paper`)">Papers/button>
    <button onclick="playGame(`scissors`)">Scissors</button>
    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
      "
    >
      Reset Score
    </button>

    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };

      function compMove() {
        let compMove = ``;

        let randomNumber = Math.random();
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          compMove = `rock`;
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          compMove = `paper`;
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          compMove = `scissors`;
        }
        return compMove;
      }

      function results(playerMove, computerMove) {
        let result = ``;

        if (computerMove === playerMove) {
          result = `tie`;
        } else if (
          (playerMove === `rock` && computerMove === `scissors`) ||
          (playerMove === `paper` && computerMove === `rock`) ||
          (playerMove === `scissors` && computerMove === `paper`)
        ) {
          result = `you win`;
        } else {
          result = `you lose`;
        }

        if (result === `you win`) {
          score.wins += 1;
        } else if (result === `you lose`) {
          score.losses += 1;
        } else if (result === `tie`) {
          score.ties += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));

        return result;
      }

      function playGame(playerMove) {
        const computerMove = compMove();
        const resultMove = results(playerMove, computerMove);

        alert(
          `You picked ${playerMove}. Computer picked ${computerMove}. ${resultMove}
          Wins : ${score.wins} Loses: ${score.losses}, Ties: ${score.ties}`,
        );
      }
    </script>
  </body>
</html>
